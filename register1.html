<script>
    async function handleDirectRegister() {
      const id = document.getElementById('regId').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      const btn = document.getElementById('btnSubmit');
      const validAlphaNumeric = /^[a-zA-Z0-9]+$/;

      if (!id || id.length < 4 || id.length > 10) {
        alert('Tài khoản (ID) phải từ 4 đến 10 ký tự!');
        document.getElementById('regId').focus();
        return;
      }
      if (!validAlphaNumeric.test(id)) {
        alert('Tài khoản không được chứa khoảng cách hoặc ký tự đặc biệt!');
        document.getElementById('regId').focus();
        return;
      }

      if (!pass || pass.length < 4 || pass.length > 10) {
        alert('Mật khẩu phải từ 4 đến 10 ký tự!');
        document.getElementById('regPass').focus();
        return;
      }
      if (!validAlphaNumeric.test(pass)) {
        alert('Mật khẩu không được chứa khoảng cách hoặc ký tự đặc biệt!');
        document.getElementById('regPass').focus();
        return;
      }

      btn.disabled = true;
      btn.innerText = 'ĐANG KHỞI TẠO...';

      try {
        // Gửi bằng định dạng Form URLSearchParams tương thích 100% với mọi Web Server
        const params = new URLSearchParams();
        params.append('account', id);
        params.append('password', pass);

        const response = await fetch('api_register.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: params.toString()
        });

        const rawText = await response.text();
        let result;
        try {
          result = JSON.parse(rawText);
        } catch (e) {
          alert('Lỗi máy chủ phản hồi:\n' + rawText.substring(0, 150));
          return;
        }

        if (result.success) {
          alert('🎉 Đăng ký thành công tài khoản [' + id + ']!\nBạn có thể đăng nhập ngay vào game.');
          document.getElementById('regId').value = '';
          document.getElementById('regPass').value = '';
        } else {
          alert('❌ ' + (result.message || 'Đăng ký thất bại'));
        }
      } catch (err) {
        alert('Lỗi kết nối: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'XÁC NHẬN ĐĂNG KÝ';
      }
    }
  </script>
